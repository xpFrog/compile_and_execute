[CANDE_CONFIG]
;; Cande uses g++ because of this line.
COMPILER=g++ 

;; The compiler flags.
COMPILER_FLAGS=-Wall -g -static

;; Cande uses dirent.h and SimpleIni.h.
COMPILER_INCLUDES= -Iinclude

;; What the output name of the exe is.
PROJECT_NAME=Cande

;; TODO: Add multi filetype support.
;; The file type this project uses.
FILE_TYPE=.cpp

